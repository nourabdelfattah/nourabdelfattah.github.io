- title: Research Focus
  type: list
  contents:
    - How <strong>biological sex</strong> shapes immune function, therapeutic response, and neuroimmune disease biology &mdash; at the intersection of cancer immunology, sex biology, and computational biology. I lead an integrated wet-lab and computational program combining mouse genetics, single-cell and spatial multi-omics, functional immunology, protein-interaction biology, and open-source software development.

